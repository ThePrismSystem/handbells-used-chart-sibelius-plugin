name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tooling:
    name: Build, lint and tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No install step: the project has no dependencies, runtime or otherwise.
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Upload built plug-ins
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: build/*.plg
